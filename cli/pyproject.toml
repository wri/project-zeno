[project]
name = "gnw-cli"
version = "0.1.0"
description = "Global Nature Watch data on the command line, as files an analysis can repeat"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fastmcp>=4.0,<5"]

[project.scripts]
gnw = "gnw_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnw_cli"]
