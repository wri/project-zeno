[project]
name = "gold"
version = "0.1.0"
description = "GOLD: the capability regression suite for the Project Zeno agent. Cases, harness and results ledger, co-located with the agent it tests."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "openrouter>=0.8.2",
    "python-dotenv>=1.0",
]

[project.scripts]
gold = "goldset.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
    "anyio>=4.0",
    "trio>=0.25",
    "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldset"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Pinned so local and CI agree regardless of user-level ruff config.
select = ["E4", "E7", "E9", "F", "I"]
