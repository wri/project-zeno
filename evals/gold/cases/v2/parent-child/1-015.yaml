    wording: 15/36 dataset_id_match failures (~42%) across historical full runs. First
    attempt, prefixing "Looking at land cover composition, " (the same technique that fully
    fixed 1-013/1-026): only addressed the SBTN side, 3/9 fresh trials still failed
    (~33%, within noise of the baseline — no real effect, all three still nudged). Second
    attempt, prefixing "Looking at general land cover composition across all vegetation
    types, " (added "across all vegetation types" to also rule out the grassland-only
    dataset): 17/18 across two 9-trial batches (~94%), a real improvement (at the old 42%
    rate, ≤1 failure in 18 trials would happen <0.1% of the time by chance) though not fully
    clean — the one residual failure was the same three-way nudge recurring at a much lower
    rate, in line with cases/README.md''s documented ~1.2% floor for precisely-worded rows.'
