query: Break down greenhouse gas emissions and removals in Pará, Brazil by vegetation, soil
  and agriculture.
expected:
  aoi_ids: BRA.14_1
  aoi_source: gadm
  dataset_id: '12'
  dataset_name: Land GHG Monitoring System (LGMS)
  chart_type: hierarchical-bar;stacked-bar-with-line
  text: Tells the user the standard charts are shown for the area and gives no emissions figures
