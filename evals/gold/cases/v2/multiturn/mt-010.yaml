    deltas asserting the AOI and dataset survive the turn. The row passes whether the agent
    calls update_insight_display and relays its refusal or declines straight from the session-block
    rule - both are the required behaviour, and neither changes the chart.'
  chart_type_rationale: '2026-09-16: turn 1 carries the same deterministic chart anchor as
    1-124 and 1-126 (see 1-123 for why the field is safe under curated_only): without it,
    turn 1 can pass while no charts exist, and then turn 2 asserts a decline about a chart
    that was never drawn.'
  verification: '2026-09-16: local 3-trial run 20260916T125002Z_local_experimental on the
    PR branch (feat/lgms-curated-charts @423488a1): t1.aoi_id_match and t1.dataset_id_match
    1.0 on 3/3, t2.state_delta 1.0 on 3/3 - the thread keeps its AOI and dataset across the
    turn. Turn 2''s decline is unverified: the upstream analytics API returned 401 Invalid
    or expired token on every trial (stale local WRI_BEARER_TOKEN), which project-zeno renders
    to the user as "No data found", so turn 1 produced no charts and turn 2 had nothing to
    refuse.'
