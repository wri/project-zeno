version: 2
updates:
  # Python (uv) - main application (pyproject.toml + uv.lock)
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    versioning-strategy: 'increase-if-necessary'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      uv-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Python (uv) - GOLD eval suite, a standalone project with its own lockfile
  - package-ecosystem: 'uv'
    directory: '/evals/gold'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    versioning-strategy: 'increase-if-necessary'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      gold-uv-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Docker - Dockerfile and docker-compose*.yaml at the repo root
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      docker-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Docker - service container images pinned in the CI workflows
  - package-ecosystem: 'docker'
    directory: '/.github/workflows'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      ci-docker-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Terraform providers (hashicorp/aws) in both root modules
  - package-ecosystem: 'terraform'
    directories:
      - '/terraform/shared'
      - '/terraform/ephemeral'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      terraform-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # pre-commit hook revisions (.pre-commit-config.yaml)
  - package-ecosystem: 'pre-commit'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      pre-commit-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      github-actions-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
