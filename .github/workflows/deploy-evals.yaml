name: Deploy Evals Environment

# Deploys an arbitrary project-zeno commit to the ECS evals environment.
#
# The commit must already have an image in ECR, which today means it is on main
# (docker-build.yml builds on push). Building arbitrary commits is a later change.
#
# The database is NOT seeded here: it restores from the snapshot built once by
# scripts/build_seed_db.sh. Only migrations run on deploy.

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: project-zeno commit SHA to deploy (must exist in ECR)
        required: true
        type: string
      dry_run:
        description: Plan only, do not apply
        required: false
        default: true
        type: boolean
      workspace:
        description: Terraform workspace, i.e. which evals environment
        required: false
        default: evals
        type: string
      run_evals:
        description: Run the eval suite against the environment after deploying
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# The state bucket has no lock table, so serialise runs per workspace.
concurrency:
  group: deploy-evals-${{ inputs.workspace }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_INPUT: "0"

jobs:
  deploy:
    name: Deploy ${{ inputs.commit_hash }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      api_base_url: ${{ steps.outputs.outputs.api_base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the image exists
        run: |
          set -euo pipefail
          aws ecr-public describe-images \
            --region us-east-1 \
            --repository-name project-zeno/zeno \
            --image-ids imageTag="${{ inputs.commit_hash }}" \
            --query 'imageDetails[0].imageTags' \
            --output text
          echo "Image found for ${{ inputs.commit_hash }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ./terraform
        run: terraform init -backend-config=vars/backend-evals.tfvars

      - name: Select workspace
        working-directory: ./terraform
        run: terraform workspace select -or-create=true "${{ inputs.workspace }}"

      - name: Terraform plan
        working-directory: ./terraform
        run: |
          terraform plan -out=tf.plan \
            -var="image_tag=${{ inputs.commit_hash }}" \
            -var="seed_snapshot_id=${{ vars.EVALS_SEED_SNAPSHOT_ID }}" \
            -var="db_password=${{ secrets.EVALS_DB_PASSWORD }}"

      - name: Terraform apply
        if: inputs.dry_run == false
        working-directory: ./terraform
        run: terraform apply -auto-approve tf.plan

      - name: Read Terraform outputs
        id: outputs
        if: inputs.dry_run == false
        working-directory: ./terraform
        run: |
          set -euo pipefail
          {
            echo "api_base_url=$(terraform output -raw api_base_url)"
            echo "cluster_name=$(terraform output -raw cluster_name)"
            echo "service_name=$(terraform output -raw service_name)"
            echo "security_group_id=$(terraform output -raw task_security_group_id)"
            echo "subnet_ids=$(terraform output -json task_subnet_ids | jq -r 'join(",")')"
          } >> "$GITHUB_OUTPUT"

      # Migrations are not a step here: the api container runs /app/db/migrate.sh
      # before uvicorn, so rolling the service applies them.
      - name: Roll the service
        if: inputs.dry_run == false
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${{ steps.outputs.outputs.cluster_name }}" \
            --service "${{ steps.outputs.outputs.service_name }}" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster "${{ steps.outputs.outputs.cluster_name }}" \
            --services "${{ steps.outputs.outputs.service_name }}"

      - name: Smoke check
        if: inputs.dry_run == false
        run: |
          set -euo pipefail
          url="${{ steps.outputs.outputs.api_base_url }}/health"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$url"; then
              echo "\nHealthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy at $url"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Evals deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ inputs.commit_hash }}\` |"
            echo "| Workspace | \`${{ inputs.workspace }}\` |"
            echo "| Dry run | \`${{ inputs.dry_run }}\` |"
            if [ "${{ inputs.dry_run }}" = "false" ]; then
              echo "| URL | ${{ steps.outputs.outputs.api_base_url }} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  evals:
    name: Run evals
    needs: deploy
    if: inputs.dry_run == false && inputs.run_evals
    uses: ./.github/workflows/evals.yaml
    with:
      environment: evals
      ref: ${{ inputs.commit_hash }}
      api_base_url: ${{ needs.deploy.outputs.api_base_url }}
    secrets: inherit
